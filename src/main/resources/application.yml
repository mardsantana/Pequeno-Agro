server:
  servlet:
    context-path: /agro-peq

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agro_peq?currentSchema=agro_peq
    username: postgres
    password: 1998
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        show_sql: true
        format_sql: true
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true

